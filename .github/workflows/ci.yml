name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# npm's post-install audit request can stall for minutes, which ran the
# bundler's installs past their 120 s timeout. BUNDLER_DEPS mirrors
# basePackages in src-tauri/resources/bundler.mjs.
env:
  npm_config_audit: false
  BUNDLER_DEPS: react react-dom esbuild postcss tailwindcss@3 lucide-react recharts date-fns framer-motion clsx tailwind-merge class-variance-authority

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  check-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
      - run: pnpm install
      - name: Check formatting
        run: cd src-tauri && cargo fmt --check
      - name: Clippy
        run: cd src-tauri && cargo clippy -- -D warnings
      - name: Pre-install bundler dependencies
        run: rm -rf ~/.terrarium/node_modules && npm install --prefix ~/.terrarium $BUNDLER_DEPS
      - name: Run tests
        run: cd src-tauri && cargo test -- --test-threads=1

  test-node:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
      - run: pnpm install
      - run: cd src-tauri/resources && pnpm install
      # The bundler tests install into fresh cache dirs. The first install from
      # a cold npm cache has taken over 120 s here, so fill the cache first.
      - name: Warm npm cache with bundler dependencies
        run: npm install --prefix "$RUNNER_TEMP/bundler-deps" $BUNDLER_DEPS
      - run: pnpm test
